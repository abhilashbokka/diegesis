[project]
name = "diegesis"
version = "0.1.0"
description = "Separating dialogue from music and effects in cinematic audio."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "Abhilash" }]
keywords = ["audio", "source-separation", "dialogue", "subtitles", "cinema"]

# Deliberately light. The first experiment needs channel arithmetic and a
# spectrum, nothing more. Separation models come later, behind an extra.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Neural separation backends, once there is a reason for them.
separation = ["torch>=2.3", "torchaudio>=2.3"]
asr = ["openai-whisper>=20231117", "torch>=2.3"]
viz = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
diegesis = "diegesis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diegesis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option in argument defaults is Typer's documented API, not the mutable
# default-argument bug B008 exists to catch.
"src/diegesis/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
